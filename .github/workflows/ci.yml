name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-eval:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.x", "22.x"]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # Core server only — the Remotion render toolchain is optional and not
      # needed for the build or the offline eval suite.
      - name: Install (core, no optional Remotion)
        run: npm ci --omit=optional --no-audit --no-fund

      # Optional system tools: with these, the end-to-end test renders a real MP4
      # (ffmpeg), SVGs are render-checked (librsvg), and narration is spoken (espeak-ng).
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg librsvg2-bin espeak-ng

      - name: Build
        run: npm run build

      - name: Test (offline)
        run: npm test
